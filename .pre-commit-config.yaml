repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: local
  hooks:
  - id: dart-format
    name: dart-format
    entry: dart format .
    language: system
    files: \.dart$
  - id: flutter-analyze
    name: flutter-analyze
    entry: flutter analyze --no-fatal-infos
    language: system
    pass_filenames: false
    files: \.dart$
