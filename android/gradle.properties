# org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
# 开启并行编译
org.gradle.parallel=true
# 开启构建缓存
org.gradle.caching=true
# 调整 JVM 内存，避免频繁 GC (GitHub Runner 有 7GB 内存，给 Gradle 2-4G 是安全的)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 仅在 CI 环境下禁用 Daemon (守护进程在一次性环境没意义，反而占内存)
org.gradle.daemon=false