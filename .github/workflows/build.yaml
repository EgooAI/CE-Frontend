name: Flutter Multi-Platform Build

on:
  push:
    branches: ["master"]
  workflow_dispatch: # 允许手动触发

jobs:
  # -------------------------
  # Job 1: Android Build
  # -------------------------
  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get short commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=API_URL="${{ secrets.API_URL }}"

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk chrono-android-${{ steps.commit.outputs.short_sha }}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-android-${{ steps.commit.outputs.short_sha }}
          path: chrono-android-${{ steps.commit.outputs.short_sha }}.apk
          if-no-files-found: error

  # -------------------------
  # Job 2: iOS Build (Unsigned)
  # -------------------------
  ios-build:
    name: iOS Build (Unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get short commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # 1. 构建 .app (文件夹)
      - name: Build iOS (No Code Sign)
        run: flutter build ios --release --no-codesign --dart-define=API_URL="${{ secrets.API_URL }}"

      # 2. 手动打包成 IPA (关键步骤)
      - name: Package into IPA
        run: |
          mkdir Payload
          # 将构建生成的 Runner.app 移动到 Payload 文件夹中
          mv build/ios/iphoneos/Runner.app Payload
          # 压缩 Payload 文件夹为 .ipa 文件
          zip -r chrono-ios-${{ steps.commit.outputs.short_sha }}.ipa Payload

      # 3. 上传 IPA
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-ios-${{ steps.commit.outputs.short_sha }}
          path: chrono-ios-${{ steps.commit.outputs.short_sha }}.ipa
          if-no-files-found: error

  # -------------------------
  # Job 3: macOS Build
  # -------------------------
  macos-build:
    name: macOS Desktop Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get short commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release --dart-define=API_URL="${{ secrets.API_URL }}"

      - name: Compress macOS App
        run: |
          cd build/macos/Build/Products/Release
          tar -czf chrono-macos-${{ steps.commit.outputs.short_sha }}.app.tar.gz *.app
          mv chrono-macos-${{ steps.commit.outputs.short_sha }}.app.tar.gz ../../../../../

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-macos-${{ steps.commit.outputs.short_sha }}
          path: chrono-macos-${{ steps.commit.outputs.short_sha }}.app.tar.gz
          if-no-files-found: error

  # -------------------------
  # Job 4: Windows Build
  # -------------------------
  windows-build:
    name: Windows Desktop Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get short commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Exe
        run: flutter build windows --release --dart-define=API_URL="${{ secrets.API_URL }}"

      - name: Compress Windows Build
        # PowerShell 压缩命令
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath chrono-windows-${{ steps.commit.outputs.short_sha }}.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-windows-${{ steps.commit.outputs.short_sha }}
          path: chrono-windows-${{ steps.commit.outputs.short_sha }}.zip
          if-no-files-found: error
