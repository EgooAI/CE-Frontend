name: Release - Build & Upload to OSS

# 触发方式：手动触发（Actions → Run workflow）
on:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  FLUTTER_CHANNEL: "stable"

# 所需 GitHub Secrets：
#   构建参数：  API_URL / XFYUN_APP_ID / XFYUN_ACCESS_KEY_ID / XFYUN_ACCESS_KEY_SECRET
#   阿里云 OSS：OSS_ENDPOINT / OSS_BUCKET / OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
#   通知：      WECHAT_WORK_WEBHOOK

jobs:
  # ====================================================
  # 准备：提取版本号 + 生成 Changelog JSON
  # ====================================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: extract
        run: |
          # 从 pubspec.yaml 读取版本，截去 +buildNumber 部分
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 版本号: $VERSION"

      - name: Generate Changelog JSON
        run: |
          VERSION=${{ steps.extract.outputs.version }}
          TODAY=$(date +%Y-%m-%d)

          # 取最近一个 tag 到 HEAD 之间的 commit 信息
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            CONTENT="首次发布"
          else
            CONTENT=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"• %s" --no-merges | head -20)
            [ -z "$CONTENT" ] && CONTENT="常规更新"
          fi

          # 将内容转义为合法 JSON 字符串
          CONTENT_JSON=$(echo "$CONTENT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")

          cat > changelog.json <<EOF
          {
            "version": "$VERSION",
            "releaseDate": "$TODAY",
            "content": $CONTENT_JSON
          }
          EOF

          echo "📝 Changelog 内容:"
          cat changelog.json

      - name: Upload Changelog Artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.json
          retention-days: 1

  # ====================================================
  # Android：构建 APK
  # ====================================================
  build-android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          android.enableR8.fullMode=false
          EOF

      # 绕过 Cargokit 在 CI 构建时下载 Rust 目标失败的问题
      - name: Pre-install Rust Targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --no-tree-shake-icons \
            --dart-define=API_URL=${{ secrets.API_URL }} \
            --dart-define=XFYUN_APP_ID=${{ secrets.XFYUN_APP_ID }} \
            --dart-define=XFYUN_ACCESS_KEY_ID=${{ secrets.XFYUN_ACCESS_KEY_ID }} \
            --dart-define=XFYUN_ACCESS_KEY_SECRET=${{ secrets.XFYUN_ACCESS_KEY_SECRET }}

      - name: Rename APK
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          cp build/app/outputs/flutter-apk/app-release.apk ${VERSION}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ needs.prepare.outputs.version }}.apk
          retention-days: 1

  # ====================================================
  # iOS：构建无签名 IPA
  # ====================================================
  build-ios:
    name: Build iOS IPA
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Get Dependencies
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install Pods
        run: cd ios && pod install

      - name: Build iOS
        run: |
          flutter build ios --release \
            --no-codesign \
            --no-tree-shake-icons \
            --dart-define=API_URL=${{ secrets.API_URL }} \
            --dart-define=XFYUN_APP_ID=${{ secrets.XFYUN_APP_ID }} \
            --dart-define=XFYUN_ACCESS_KEY_ID=${{ secrets.XFYUN_ACCESS_KEY_ID }} \
            --dart-define=XFYUN_ACCESS_KEY_SECRET=${{ secrets.XFYUN_ACCESS_KEY_SECRET }}

      - name: Package IPA
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ${VERSION}.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ needs.prepare.outputs.version }}.ipa
          retention-days: 1

  # ====================================================
  # 上传至阿里云 OSS
  # ====================================================
  upload-oss:
    name: Upload to Aliyun OSS
    needs:
      - prepare
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/android

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./artifacts/ios

      - name: Download Changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: ./artifacts

      - name: Install ossutil
        run: |
          curl -sL https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64 -o /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil

      - name: Upload to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          VERSION=${{ needs.prepare.outputs.version }}

          ossutil config -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"

          echo "📦 上传 Android APK..."
          ossutil cp "artifacts/android/${VERSION}.apk" \
            "oss://${OSS_BUCKET}/app-releases/android/${VERSION}.apk" -f

          echo "📦 上传 iOS IPA..."
          ossutil cp "artifacts/ios/${VERSION}.ipa" \
            "oss://${OSS_BUCKET}/app-releases/ios/${VERSION}.ipa" -f

          echo "📝 上传 Changelog..."
          ossutil cp artifacts/changelog.json \
            "oss://${OSS_BUCKET}/app-releases/android/changelogs/${VERSION}.json" -f
          ossutil cp artifacts/changelog.json \
            "oss://${OSS_BUCKET}/app-releases/ios/changelogs/${VERSION}.json" -f

          echo "✅ 全部上传完成"
          echo "   oss://${OSS_BUCKET}/app-releases/android/${VERSION}.apk"
          echo "   oss://${OSS_BUCKET}/app-releases/ios/${VERSION}.ipa"
          echo "   oss://${OSS_BUCKET}/app-releases/android/changelogs/${VERSION}.json"
          echo "   oss://${OSS_BUCKET}/app-releases/ios/changelogs/${VERSION}.json"

  # ====================================================
  # 企业微信通知
  # ====================================================
  notify:
    name: Notify WeChat Work
    needs:
      - prepare
      - upload-oss
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Notify Success
        if: needs.upload-oss.result == 'success'
        env:
          WEBHOOK: ${{ secrets.WECHAT_WORK_WEBHOOK }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"## ✅ CE-Frontend **v${VERSION}** 发布成功\\n> 触发人：**${{ github.actor }}**\\n> 时间：$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')\\n\\n**OSS 产物路径：**\\n\`app-releases/android/${VERSION}.apk\`\\n\`app-releases/ios/${VERSION}.ipa\`\\n\`app-releases/android/changelogs/${VERSION}.json\`\\n\\n[查看构建日志](${RUN_URL})\"
              }
            }"

      - name: Notify Failure
        if: needs.upload-oss.result != 'success'
        env:
          WEBHOOK: ${{ secrets.WECHAT_WORK_WEBHOOK }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"## ❌ CE-Frontend **v${VERSION}** 发布失败\\n> 触发人：**${{ github.actor }}**\\n> 时间：$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')\\n\\n[查看构建日志](${RUN_URL})\"
              }
            }"
